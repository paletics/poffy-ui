version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    versioning-strategy: "auto"
    groups:
      storybook:
        patterns:
          - "@storybook/*"
          - "storybook"
      lint:
        patterns:
          - "eslint*"
          - "@typescript-eslint/*"
          - "prettier"
      testing:
        patterns:
          - "vitest*"
          - "@vitest/*"
          - "playwright*"
          - "@playwright/*"
      panda:
        patterns:
          - "@pandacss/*"
