name: Test and Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check encoding
        run: pnpm check:encoding

      - name: Check prohibited licenses
        run: pnpm check:licenses

      - name: OSS audit (secrets / internal refs)
        run: pnpm oss:audit

      - name: Tier audit (no Pro/Enterprise refs)
        run: pnpm check:tier

      - name: Check package boundaries
        run: pnpm check:package-boundaries

      - name: Build workspace dependencies for checks
        run: pnpm --filter @poffy-ui/types --filter @poffy-ui/system --filter @poffy-ui/behavior build

      - name: Generate Panda styled-system
        run: pnpm prepare:codegen

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit -- --run

      - name: Build
        run: pnpm build

      - name: Check package exports
        run: pnpm check:exports

      - name: Check package declarations
        run: pnpm check:declarations

      - name: Check packed package install
        run: pnpm check:pack-smoke

      - name: Check package integrity (publint)
        run: |
          for package in packages/react packages/system packages/behavior packages/types; do
            npx publint "$package"
          done

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Browser tests
        run: pnpm test:browser

      - name: Storybook tests
        run: pnpm test:storybook

      - name: Run E2E Tests
        run: pnpm test:e2e
